apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aks-webapp
  template:
    metadata:
      labels:
        app: aks-webapp
    spec:
      containers:
        - name: aks-webapp
          image: <acr-login-server>/aks-webapp:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aks-webapp-service
spec:
  type: LoadBalancer
  selector:
    app: aks-webapp
  ports:
    - port: 80
      targetPort: 80